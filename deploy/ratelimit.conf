# Rate limits for balagh.space. Installed at /etc/nginx/conf.d/balagh-ratelimit.conf
# so the zones live in the http block, before the site includes them.
#
# The site is open to anyone with the link and every generation spends model quota, so one
# visitor must not be able to drain it. Generation is slow (half a minute a step), so a human
# cannot exceed these; a script can.

# Only writes spend quota (generation, rendering): reads are not counted, or opening a project page,
# which makes several GETs at once, would trip the limit and show "429" to a visitor who did nothing.
map $request_method $balagh_write_key {
    default $binary_remote_addr;
    GET     "";
    HEAD    "";
    OPTIONS "";
}
# 20 generation requests a minute per IP, with short bursts tolerated.
limit_req_zone $balagh_write_key zone=balagh_api:10m rate=20r/m;
# A generous ceiling for the static front end, so the page itself never trips the limit.
limit_req_zone $binary_remote_addr zone=balagh_web:10m rate=240r/m;
# No more than 20 requests in flight at once from one IP (a page load opens several, and videos stream).
limit_conn_zone $binary_remote_addr zone=balagh_conn:10m;

limit_req_status 429;
limit_conn_status 429;
