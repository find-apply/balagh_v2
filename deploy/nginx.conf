# balagh.space: static React build + /api proxied to the FastAPI service.
server {
    listen 80;
    listen [::]:80;
    server_name balagh.space;

    access_log /var/log/nginx/balagh.space.access.log;
    error_log  /var/log/nginx/balagh.space.error.log;

    root /var/www/balagh/web/dist;
    index index.html;

    location / {
        limit_req zone=balagh_web burst=60 nodelay;
        limit_conn balagh_conn 20;
        try_files $uri /index.html;
    }

    location /api/ {
        # Generation spends model quota: cap it per visitor. See deploy/ratelimit.conf.
        limit_req zone=balagh_api burst=10 nodelay;
        limit_conn balagh_conn 20;

        proxy_pass http://127.0.0.1:8610/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generation calls take up to a couple of minutes.
        proxy_read_timeout 300;
    }
}
