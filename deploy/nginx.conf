# balagh.findapply.com: static React build + /api proxied to the FastAPI service.
server {
    listen 80;
    listen [::]:80;
    server_name balagh.findapply.com;

    access_log /var/log/nginx/balagh.findapply.com.access.log;
    error_log  /var/log/nginx/balagh.findapply.com.error.log;

    root /var/www/balagh/web/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8610/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generation calls take up to a couple of minutes.
        proxy_read_timeout 300;
    }
}
