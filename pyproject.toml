[project]
name = "reels-gen"
version = "0.1.0"
description = "Video idea and script generation API"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115",
    "google-genai>=2.28.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0.54",
    "internetarchive>=5.0",
    "openai>=3.26.0",
    "google-auth>=2.40",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8"]
